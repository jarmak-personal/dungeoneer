id: secret:the_second_setting
kind: secret
schema: dwd.secret.v1
name: The Second Setting
summary: >
  A compartmentalized Ilvane research network has working prototypes of setwork
  that use no khevra. The figures draw from measurable sources such as trained
  casters, stored charge, tides, and weather. They reproduce setwork's forms without
  its unexplained multiplier, making them expensive, lower-yield, and harder to use.
  The researchers pursue supply independence and call the work the Second Setting.
facts:
  - fact:conventional_arcane_obeys_conservation
  - fact:second_setting_prototypes_exist
holders:
  - faction:second_setting_network
visibility: faction_private:faction:second_setting_network
notes: >
  Knowledge is compartmentalized even inside the network. The Ilvane Accord as a
  whole is not a holder; disclosure requires authorization from the research cell.
reveal_conditions:
  - { type: trust_earned, with: "faction:second_setting_network", note: "Researchers disclose prototype capabilities only within the scope authorized by their cell." }
