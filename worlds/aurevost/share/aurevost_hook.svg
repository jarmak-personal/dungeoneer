<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Aurevost one-page campaign hook</title>
  <desc id="desc">A themed one-page pitch for the Aurevost default Dungeoneer world.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102528"/>
      <stop offset="0.42" stop-color="#16393b"/>
      <stop offset="1" stop-color="#261e24"/>
    </linearGradient>
    <radialGradient id="ember" cx="50%" cy="35%" r="62%">
      <stop offset="0" stop-color="#f2b55f" stop-opacity="0.35"/>
      <stop offset="0.32" stop-color="#d78645" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#0d181a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#061113" flood-opacity="0.42"/>
    </filter>
    <style>
      .smallcaps { font-family: Avenir Next, Optima, Trebuchet MS, sans-serif; font-size: 24px; letter-spacing: 4px; text-transform: uppercase; fill: #c9d1c2; }
      .title { font-family: Georgia, Times New Roman, serif; font-size: 104px; font-weight: 700; fill: #f4ead0; }
      .tagline { font-family: Georgia, Times New Roman, serif; font-size: 36px; font-style: italic; fill: #f0c784; }
      .body { font-family: Avenir Next, Optima, Trebuchet MS, sans-serif; font-size: 26px; fill: #e9eadc; }
      .body-muted { font-family: Avenir Next, Optima, Trebuchet MS, sans-serif; font-size: 25px; fill: #c8d0c5; }
      .section { font-family: Avenir Next, Optima, Trebuchet MS, sans-serif; font-size: 23px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; fill: #f0c784; }
      .question { font-family: Avenir Next, Optima, Trebuchet MS, sans-serif; font-size: 25px; fill: #f5eddb; }
      .micro { font-family: Avenir Next, Optima, Trebuchet MS, sans-serif; font-size: 21px; fill: #b8c4b9; }
      .rule { stroke: #d79a57; stroke-width: 2; stroke-opacity: 0.72; }
      .thin { stroke: #7ca6a2; stroke-width: 1.5; stroke-opacity: 0.38; }
      .brass { fill: #d79a57; }
      .panel { fill: #172528; stroke: #d79a57; stroke-width: 2; stroke-opacity: 0.7; }
    </style>
  </defs>

  <rect width="1200" height="1600" fill="url(#sea)"/>
  <rect width="1200" height="1600" fill="url(#ember)"/>

  <g opacity="0.26">
    <path d="M70 1280 C210 1220 304 1300 438 1243 C576 1185 675 1265 804 1204 C935 1142 1030 1218 1130 1168" fill="none" class="thin"/>
    <path d="M65 1352 C208 1290 310 1370 445 1312 C590 1250 680 1330 810 1268 C938 1207 1036 1285 1135 1233" fill="none" class="thin"/>
    <path d="M75 1420 C216 1366 314 1445 450 1387 C591 1328 680 1410 820 1340 C940 1280 1040 1355 1132 1310" fill="none" class="thin"/>
  </g>

  <g opacity="0.22">
    <path d="M155 1080 L210 940 L278 1080 Z" fill="#f4ead0"/>
    <rect x="205" y="850" width="9" height="230" fill="#f4ead0"/>
    <path d="M836 1010 L902 850 L982 1010 Z" fill="#f4ead0"/>
    <rect x="898" y="738" width="10" height="272" fill="#f4ead0"/>
    <path d="M868 766 C902 724 954 726 988 766 C954 742 902 742 868 766 Z" fill="#f4ead0"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="62" width="1060" height="1476" rx="18" fill="#10191b" opacity="0.80"/>
    <rect x="91" y="83" width="1018" height="1434" rx="10" fill="none" stroke="#d79a57" stroke-width="3" stroke-opacity="0.78"/>
  </g>

  <g transform="translate(125 105)">
    <text class="smallcaps" x="0" y="0">A D&amp;D-style world for Dungeoneer</text>
    <text class="title" x="0" y="95">Aurevost</text>
    <line class="rule" x1="0" y1="128" x2="950" y2="128"/>
    <text class="tagline" x="0" y="178">The world runs on a miracle that may be eating it.</text>

    <g transform="translate(0 248)">
      <text class="section" x="0" y="0">What Everyone Knows</text>
      <text class="body" x="0" y="46">Aurevost is an ocean world of crowded ports, compact nations,</text>
      <text class="body" x="0" y="83">airship gantries, old shrines, and industrial magic. Three</text>
      <text class="body" x="0" y="120">centuries ago, the First Setting made arcane power repeatable</text>
      <text class="body" x="0" y="157">at civic scale. Khevra now runs modern life: lamps, lifts,</text>
      <text class="body" x="0" y="194">foundries, message-glass, ships, weapons, and prestige airships.</text>
    </g>

    <g transform="translate(0 488)">
      <rect class="panel" x="0" y="0" width="950" height="116" rx="8" opacity="0.88"/>
      <text class="body" x="34" y="48">On the day khevra changed the world, reliable divine communion failed.</text>
      <text class="body-muted" x="34" y="88">Most people decided the gods had stepped aside.</text>
    </g>

    <g transform="translate(0 662)">
      <text class="section" x="0" y="0">The Trouble</text>
      <text class="body" x="0" y="46">Refinery workers sicken slowly. Living places recoil from active</text>
      <text class="body" x="0" y="83">setwork. Old devotional traces dim near loaded khevra. A militant</text>
      <text class="body" x="0" y="120">revival says the modern world is poison. Powerful institutions</text>
      <text class="body" x="0" y="157">answer: maybe, but the elevators still need to run and the food</text>
      <text class="body" x="0" y="194">still needs to move.</text>
    </g>

    <g transform="translate(0 910)">
      <text class="section" x="0" y="0">The Opening</text>
      <text class="body" x="0" y="46">You are nobodies in Caelport, a vertical port city of sea docks</text>
      <text class="body" x="0" y="83">below and airship gantries above. In the Undercroft, a cramped</text>
      <text class="body" x="0" y="120">tavern shares a wall with a bricked-over shrine. Behind it, one</text>
      <text class="body" x="0" y="157">ember has burned since the First Setting. A quiet stranger has</text>
      <text class="body" x="0" y="194">started asking about old devotional objects.</text>
    </g>

    <g transform="translate(0 1160)">
      <text class="section" x="0" y="0">What Play Can Become</text>
      <circle class="brass" cx="9" cy="40" r="5"/>
      <text class="question" x="28" y="49">Hunt veined beasts, smuggle relics, crew a ship or airship.</text>
      <circle class="brass" cx="9" cy="80" r="5"/>
      <text class="question" x="28" y="89">Take Concord bounties, protect a shrine, sell a core badly.</text>
      <circle class="brass" cx="9" cy="120" r="5"/>
      <text class="question" x="28" y="129">Decide what fragmentary evidence demands of ordinary people.</text>
    </g>

    <g transform="translate(0 1315)">
      <text class="section" x="0" y="0">Feedback Wanted</text>
      <text class="micro" x="0" y="42">Would you want to play here? Which hook sparks a character? What feels unclear?</text>
      <text class="micro" x="0" y="78">Maritime magitech | political mystery | low-level start | optional planetary stakes</text>
    </g>
  </g>
</svg>
