id: secret:the_first_bargain
kind: secret
schema: dwd.secret.v1
name: The First Bargain
summary: >
  The Cantor finds worlds by listening: cross-planar bargains shine like beacons in
  the planar dark, and a world's pact traffic tells a patient consumer where mortals
  are, what they want, and what they will trade for it. Aurevost was found that way.
  The cultivation of Tavian Sorrell's discovery ran through a pact-shaped patronage
  arrangement, and its oblique traces — payments, letters, a patron no genealogy can
  place — still sit unread in House Sorrell's restricted archives.
facts:
  - fact:pacts_are_planar_beacons
  - fact:cantor_locates_worlds_through_pact_traffic
  - fact:first_setting_cultivated_through_pact_patronage
  - fact:patrons_fear_and_avoid_the_cantor
holders: []
visibility: internal
notes: >
  No living mortal holds this whole. Edreth holds the method knowledge (see
  secret:cantor_operational_knowledge) but does not believe any mortal record of the
  patronage matters; the archive traces survive precisely because burning them was
  beneath the Cantor's regard. Guardrails for authoring: the pact ecosystem is
  diverse and mostly unrelated to the Cantor — it hunts within that ecosystem, it
  does not own it. Most patrons know nothing; some know enough to be afraid; at
  least one patron should eventually be authored as a refugee from a consumed world,
  the one being who knows exactly what is coming and is too frightened to say its
  name plainly.
implications:
  hero_line: >
    This is the doorway of the Sorrell archive line. A warlock's hedging patron,
    pact scholarship, or an archive investigation can each converge on the same
    question — who patronized Tavian, and from where — and connect the First
    Setting to a deliberate arrival rather than a lucky invention.
  if_edreth_learns: >
    If the party visibly connects pact scholarship to the Sorrell archives, Edreth
    revises his contempt for mortal records and moves to buy, burn, or discredit
    the archive line — the first time local resistance forces the Cantor to correct
    its own hubris.
