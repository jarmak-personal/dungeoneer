id: secret:the_tidegift
kind: secret
schema: dwd.secret.v1
name: The Tidegift
summary: >
  The First Land was overburdened because all peoples, gods, divine traffic, living
  memory, and origin-weight were concentrated in one living place. The gods responded
  by opening the waters and teaching the peoples to cross: currents, tides, boatcraft,
  island-making, and the sacred law of distance. The dispersal was not exile or fall;
  it was a gift that let the peoples become distinct and let the First Land heal. The
  same threshold changed divine nearness: the gods moved to the heavens but maintained
  strong threads of communion with the peoples. The healed source now rejects khevra,
  active setwork, and the Cantor's contamination.
facts:
  - fact:first_land_is_common_cradle
  - fact:first_land_overburdened_by_origin_concentration
  - fact:gods_guided_tidegift
  - fact:gods_taught_waterways
  - fact:gods_walked_among_people_before_tidegift
  - fact:gods_withdrew_to_heavens_after_tidegift
  - fact:gods_maintained_heavenly_threads_before_khevra
  - fact:first_land_healed_after_tidegift
  - fact:first_land_rejects_khevra
  - fact:asha_can_dwell_near_first_land
holders: []
visibility: internal
registers:
  common: "the Tidegift"
  devotional: "the Opening of the Waters"
  folk_sailor: "when the gods taught the sea"
implications:
  current_absence: >
    Modern Aurevost avoids the First Land because the tools and assumptions of modern
    power fail there: active sets, airship approach, instruments, survey rigs,
    extraction machinery, and state logistics become liabilities.
  asha_role: >
    The Asha are not omniscient guardians of the cradle. Their low/no-khevra,
    living-systems practice is compatible with the First Land's margins, so they
    preserve access without knowing they have turned back toward home.
  return: >
    The First Land can receive limited witnesses, pilgrims, and covenantal return.
    It is not available as an exploitable refuge, colony, military redoubt, or clean
    replacement resource for khevra-dependent civilization.
