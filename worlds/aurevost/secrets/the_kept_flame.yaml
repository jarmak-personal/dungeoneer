id: secret:the_kept_flame
kind: secret
schema: dwd.secret.v1
name: The Kept Flame
summary: >
  The Hearthward have observed that the Emberglass has burned since the First Setting,
  responds to living memory, and dims near heavily loaded setwork. They believe it
  preserves a path to Vesh, but the observations do not prove what the ember contains.
facts:
  - fact:emberglass_has_burned_since_first_setting
  - fact:emberglass_dims_near_active_sets
holders:
  - npc:tovin_marsh
  - npc:wick
  - faction:hearthward
visibility: dm_only
reveal_conditions:
  - { type: trust_earned, with: "faction:hearthward", note: "Tovin reveals the shrine and its recorded observations to people the Hearthward trust." }
  - { type: clue_discovered, clue: "the ember responds to living memory but dims near active sets" }
