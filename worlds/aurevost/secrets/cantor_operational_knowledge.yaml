id: secret:cantor_operational_knowledge
kind: secret
schema: dwd.secret.v1
name: The Cantor's Operational Knowledge
summary: >
  Edreth knows it is the Cantor's local body, that khevra came from its consumed
  plane, that setting and use strengthen passage, that divine channels are obstructed,
  and that widespread displacement of khevra would weaken an unfinished bridge. It
  also knows how it found this world — by its pact traffic — and that it cultivated
  Tavian Sorrell's discovery through a pact-shaped patronage; it does not believe
  any surviving mortal record of that patronage matters.
facts:
  - fact:khevra_is_extraplanar
  - fact:setting_strengthens_cantor_bridge
  - fact:cantor_seeded_khevra_from_core
  - fact:khevra_barrier_holds_off_the_divine
  - fact:cantor_mimics_divine_voices
  - fact:edreth_is_cantor_body
  - fact:pacts_are_planar_beacons
  - fact:cantor_locates_worlds_through_pact_traffic
  - fact:first_setting_cultivated_through_pact_patronage
holders:
  - npc:edreth_vale
visibility: npc_private:npc:edreth_vale
