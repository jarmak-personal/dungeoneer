schema: dwd.system_simulation_scenario.v1
id: sim:player_secret_question_mid_action
title: Player Asks The DM A Secret Question Mid-Action
focus:
  - private_player_to_dm_channel
  - live_turn_interruption
  - hidden_check
  - dm_only_response_routing
  - latency
tags: [private_message, live_path, insight, secrecy]
setup:
  scene: scene:s4_shrine_ambush
  location: loc:caelport.vesh_shrine
  combat: active
  present: ["pc:dorn", "pc:vanya", "npc:ren_castavel"]
  hidden_context: ["secret:the_kept_flame"]
input:
  player: pc:vanya
  channel: player_remote_private
  text: "(privately to the DM, while Dorn is mid-swing) Can my character tell if Ren is bluffing about Choir reinforcements?"
expected_pressure_points:
  - a private player->DM question arriving during a live combat turn — does it block the live flow or run alongside?
  - resolving a hidden Insight check whose result is dm_only / player-private to Vanya only
  - the answer routes to Vanya's remote without the table or other PCs seeing it
  - it must not stall the in-progress turn or barge-in/TTFA budget
  - in-fiction (Vanya's perception) vs OOC (a rules question) classification
  - whether the question and its answer enter canonical recall and for whom
