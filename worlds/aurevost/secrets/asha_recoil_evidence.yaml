id: secret:asha_recoil_evidence
kind: secret
schema: dwd.secret.v1
name: The Asha Recoil Evidence
summary: >
  Across generations, the Asha have observed that living systems recoil from active
  khevra, contamination accumulates around its use, setwork weakens in Othara's
  interior and at Caldrin, and fragmentary divine or natural guidance draws sensitive
  people inward. The evidence establishes a repeatable incompatibility without
  establishing its cause.
facts:
  - fact:living_systems_recoil_from_khevra
  - fact:rejection_zones_disrupt_setwork
holders:
  - faction:asha
visibility: faction_private:faction:asha
notes: >
  Individual Asha interpret this shared evidence differently. The bundle establishes
  observed incompatibility without naming a source, origin, or directing intelligence.
