id: thread:the_veined_trade
kind: thread
schema: dwd.thread.v1
name: The Veined Trade
status: active
summary: >
  Working the deposits harder produces more infusion at the margins, and a market has grown
  around it: cullers clear the veined near settlements and harvest cores, brokers move them, and
  an emerging augmentation trade turns cores into grafts. It is bread-and-butter work — bounties,
  escort, salvage, supply — that several powers are quietly racing to control.
stakes:
  public: "Veined beasts threaten deposit settlements and shipping; cores are worth hunting for."
  hidden: >
    The trade's growth is a legible measure of how hard khevra is being worked, and every graft
    places infused tissue inside a living body. Demand pulls cullers deeper and rewards more extraction.
participants:
  - faction:caelport_concord
  - faction:marovar
  - faction:house_sorrell
  - faction:asha
  - faction:ilvane_accord
leads:
  - creature:khevra_infused
  - item:khevra_core
  - "Concord cull-licenses, bounties, and the uncertified core market beneath them"
  - "the first grafted operatives and fitters appearing in port cities"
  - "blooms flaring where deposits are newly or heavily worked"
resolution_conditions:
  - "establish how a given crew works the trade — licensed culling, salvage, brokerage, or refusal"
  - "decide who the cores are sold to, and what those buyers build"
  - "surface the link between deposit pressure, blooms, and the augmentation frontier, or leave it unexamined"
visibility: dm_only
note: >
  An opening-tier, self-standing playstyle: a sandbox crew can hunt the veined for a whole campaign
  without touching the planetary plot. The deeper barometer is available to a table that looks, not required.
