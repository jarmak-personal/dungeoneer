schema: dwd.predicate_vocabulary.v1
version: 1
source_refs:
  - source:setting_notes
predicates:
  accepts_as_externality: "Subject knowingly tolerates the object as a cost shifted outside its decision boundary."
  adopts_operational_stance: "Subject faction or actor has adopted the described operational posture or course of action as current; the value names it and may reference a target entity. Supersede to change it."
  amplifies_arcane_effect_by_drawing_from: "Subject produces amplification by drawing energy from the object."
  anchors: "Subject provides the principal institutional foundation for the object."
  arises_from: "Subject condition develops because of sustained exposure to or contact with the object."
  archives_contain: "Subject's restricted archives contain the object."
  became_overburdened_by: "Subject place or system became unsustainable under the concentration or pressure named by the object."
  can_be_aligned_as: "Subject material can be structurally configured as the object."
  can_dwell_within: "Subject can live, operate, or remain within the object place or condition without violating its constraints."
  cannot_amplify_beyond: "Subject cannot produce more effect than the object permits."
  carries_divine_trace_of: "Subject carries a genuine but incomplete divine trace of the object."
  conceals_assessment_of: "Subject possesses but withholds an institutional assessment of the object."
  conducted: "Subject deliberately performed the historical occurrence named by the object."
  controls_location: "Subject exercises effective institutional control over the object location."
  covertly_steers: "Subject secretly shapes the choices or direction of the object actor."
  consciously_departed_from: "Subject deliberately left the object organization while understanding that choice."
  develops: "Subject actively researches or creates the object capability."
  disrupt: "Subject reliably interferes with the operation of the object."
  dissolved: "Subject historical change broke down the object social structure."
  does_not_transmit_between: "Subject condition does not pass contagiously between members of the object class."
  enables: "Subject makes the object capability possible."
  exports_controlled_versions_of: "Subject exports deliberately restricted versions of the object."
  failed_during: "Subject ceased functioning during the object historical occurrence."
  forces_population_contraction_in: "Subject condition lowers sustainable population within the object world."
  guided_departure_from: "Subject guided people or communities away from the object place as a deliberate protective movement."
  has_working_prototypes_of: "Subject possesses functioning but non-production prototypes of the object."
  has_burned_since: "Subject has remained continuously lit since the object historical occurrence."
  healed_after: "Subject recovered, stabilized, or regenerated after the object event or condition."
  impersonates: "Subject presents itself through channels as the object identity."
  indicates_strength_of: "Changes in the subject provide evidence about the strength of the object."
  is_common_origin_of: "Subject is the shared historical origin of the object."
  is_embodied_extension_of: "Subject actor is a local embodied extension of the object entity."
  is_led_by: "Subject organization has the object leadership structure."
  joined: "Subject entered or became a member of the object organization."
  leads_world_in: "Subject has the strongest demonstrated world capability in the object domain."
  maintained_threads_to: "Subject sustained strong divine, spiritual, or communicative bonds to the object."
  member_of: "Subject actor belongs to the object faction."
  mostly_faded_into: "Subject mostly declined into, was repurposed as, or survived only through the object social or physical remnants."
  maintains: "Subject continues to sustain the object bond, practice, or condition."
  dims_near: "Subject visibly dims in proximity to the active object."
  opposes: "Subject actively works against the object."
  originates_outside_world: "Subject originated outside the object world."
  is_regarded_as: "Subject is commonly perceived or socially framed as the object judgment."
  persisted_as: "Subject endured in the social form, role, or practice named by the object."
  preserves_weakened_connection_to: "Subject bond maintains a limited connection to the object."
  raised_carrying_capacity_of: "Subject increased the sustainable population of the object."
  receives_aid_from: "Subject receives material or operational aid from the object source."
  recoil_from: "Subject living systems exhibit repeatable rejection responses to the object."
  rejects: "Subject place, system, or being actively refuses compatibility with the object."
  reduces_energy_flow_through: "Subject reduces energy flow through the object when it displaces the incumbent source."
  provided_precedent_for: "Subject earlier event or pattern made the object later interpretation more culturally plausible."
  ruptured: "Subject broke, severed, or left only fragmentary remnants of the object connection."
  drained_to_near_powerlessness: "Subject conditions together reduced the object's power to near nothing without destroying or imprisoning it."
  holds_the_divine_away_from: "Subject barrier, rather than raw force, keeps weakened divine power from reaching or opposing the object."
  seeded_material_outward_from: "Subject introduced material that propagated outward from the object location."
  senses_as_incompatible: "Subject directly senses the object as incompatible without establishing its cause."
  strengthens_planar_connection_for: "Subject increases the stability or capacity of a planar connection used by the object."
  taught: "Subject taught, revealed, or transmitted the object practice or capability."
  tends_location: "Subject maintains and cares for the object location."
  triggered_resonance_in: "Subject occurrence caused sympathetic resonance in the object."
  unknowingly_guards: "Subject protects the object without knowing its full identity or significance."
  usually_kills: "Subject condition ordinarily kills the object before an exceptional stabilization can occur."
  weakened_after: "Subject became less reliable, powerful, or available after the object event."
  walked_among: "Subject lived, manifested, or acted directly among the object community in ordinary world history."
  withdrew_to: "Subject moved ordinary presence or seat to the object realm, place, or state."
