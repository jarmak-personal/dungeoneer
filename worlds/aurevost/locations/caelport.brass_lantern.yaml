id: loc:caelport.brass_lantern
kind: location
schema: dwd.location.v1
name: The Brass Lantern
parent: loc:caelport
scale: building
summary: >
  A cramped tavern wedged into the Undercroft, with a bricked arch behind the bar.
  The only place in Caelport where a real flame is always kept lit —
  the owner insists it is "for the draft."
access: { public: true, restrictions: [] }
atmosphere:
  sights: ["a single real candle-flame on the bar", "soot-dark beams", "a bricked archway behind the taps", "mismatched dock crowd"]
  sounds: ["lift-hum through the wall", "low talk", "a kettle"]
  smells: ["tallow", "spilled ale", "old stone"]
exits:
  - { to: "loc:caelport", mode: walk, travel_time: "1 min" }
  - { to: "loc:caelport.vesh_shrine", mode: "behind the bricked arch", hidden: true, travel_time: "1 min", visibility: dm_only }
security: { danger_level: 1, controlling_faction: null }
dm_notes:
  visibility: dm_only
  text: >
    This is the default opening location. Wick keeps the bar; the kept flame is not
    for the draft. The Hearthward meet here, quietly.
visibility: table
