id: secret:the_cantor
kind: secret
schema: dwd.secret.v1
name: The Complete Cantor Incursion
summary: >
  The Cantor is an extraplanar consumer that exhausts worlds and moves on. It seeded
  khevra outward from Aurevost's planetary interior, cultivated competitive use, walled
  the divine off behind the spreading khevra lattice, and embodied itself as Edreth Vale.
  Othara's interior is the healed common cradle of Aurevost's peoples and gods, a
  significance the Cantor mistakes for a local rejection anomaly.
facts:
  - fact:khevra_is_extraplanar
  - fact:setting_strengthens_cantor_bridge
  - fact:cantor_seeded_khevra_from_core
  - fact:khevra_ruptured_heavenly_threads
  - fact:divine_power_drained_to_near_nothing
  - fact:khevra_barrier_holds_off_the_divine
  - fact:cantor_mimics_divine_voices
  - fact:edreth_is_cantor_body
  - fact:first_land_is_common_cradle
  - fact:first_land_rejects_khevra
holders: []
visibility: internal
nature: >
  The Cantor is one consumer among many, and Aurevost is one world on a long list. It
  is near a god in power, but it cannot simply reach in and end a pantheon. Khevra is
  its weapon precisely because the spreading lattice forms an intensely effective
  barrier to the divine: the accumulating barrier and the centuries-long collapse of
  belief together drain the old gods toward powerlessness, and the Cantor outlasts them
  behind that wall rather than slaying or jailing them. Aurevost is food, not an
  enemy. The Cantor does not hate its peoples, covet their thrones, or want their
  suffering for its own sake; it thinks of them primarily as the population setting,
  using, and accelerating the material that feeds it. Being beneath its regard,
  rather than the target of its malice, is the horror.
the_name: >
  "The Cantor" is the name it offers to mortals who manage to oppose it directly — a
  dry, tongue-in-cheek divine joke. The motif is musical and resonant: khevra is
  aligned, attuned, made to resonate; a setting is a chord struck in the lattice; the
  Cantor is the voice that leads the song the whole world has unknowingly joined.
embodiment: >
  Edreth Vale is a necessary evil to the Cantor, not a relished disguise. Wearing human
  skin makes the work easier — it lets the Cantor lead the loud opposition from inside,
  move among believers, and steer panic toward harmless ends. It finds the embodiment
  distasteful and would shed it gladly once the bridge no longer needs a face.
authoring_note: >
  Steer at the altitude of strategic husbandry, not personal hatred. The Cantor is
  a tactical and strategic mastermind, but its goal is consumption: increase khevra
  setting, use, dependency, and acceleration until the bridge can sustain itself.
  It sets conditions, plants incentives, and applies deliberate levers (the
  opposition it fronts, a nudge to a succession, pressure toward airship and weapons
  expansion), but it does not run the world's every faction as a named asset or hold
  a personal vendetta against any party. It mostly does not care which nation
  profits, which faction wins, or which local injustice consumes a table's attention,
  as long as khevra keeps being set, used, expanded, and accelerated. Keep it as
  operating horror the table slowly realizes, not a single reveal that retroactively
  flattens the world's politics into one being's puppet show. The world is a real
  political situation that would exist without it; the Cantor is the farmer pressing
  on its seams, not an angry destroyer trying to punish it.
failure_condition: >
  Before the bridge sustains itself, displacement of khevra reduces its energy flow.
  Destroying Edreth reduces local agency but does not kill the extraplanar whole.
  After full planar merger, the embodied and extraplanar being become jointly mortal
  while Aurevost itself approaches destruction.
