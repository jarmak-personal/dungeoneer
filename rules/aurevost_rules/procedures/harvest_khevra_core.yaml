id: rules:procedure.harvest_khevra_core
schema: dwd.rules_procedure.v1
pack: rules:pack.srd_5e
name: Harvest Khevra Core
source: "Aurevost original 5e extension"
summary: >
  The correct mechanical path for recovering value from a defeated veined creature:
  identify the lattice, avoid destabilizing damage, stabilize the core, then harvest.
  The procedure is a normal 5e-style ability/tool check with graded outcomes.
preconditions:
  - defeated_creature_has_template: rules:template.khevra_infused
  - creature_is_dead
  - core_not_already_removed
  - actor_can_spend_required_time
time:
  careful: { duration: "10 minutes", dc_modifier: 0 }
  rushed: { duration: "1 minute", dc_modifier: 5, note: "Used when danger or pursuit prevents a careful harvest." }
check:
  kind: ability_check
  allowed_skills: [arcana, nature, survival, medicine]
  allowed_tools: [alchemist_supplies, healer_kit, harvester_tools]
  dc_formula: "8 + creature_proficiency_bonus + creature_constitution_modifier + time.dc_modifier"
  advantage_sources:
    - prior_successful_identification_check
    - proper_harvester_tools
    - asha_or_culler_training
    - "eligible contamination read benefit from rules:condition.khevra_contamination, once its trigger is authored"
  disadvantage_sources:
    - rushed_without_tools
    - core_damaged_by_finishing_blow
    - excessive_khevra_load_without_protection
outcomes:
  strong:
    rule: "Success by 10 or natural 20."
    result:
      - { kind: item_state, item: item:khevra_core, maximum_grade: intact }
      - { kind: narration_only, note: "Recover usable crystalline trace material around the intact core." }
  success:
    rule: "Meets or beats DC."
    result:
      - { kind: item_state, item: item:khevra_core, maximum_grade: intact }
  partial:
    rule: "DC minus 5 through DC minus 1."
    result:
      - { kind: item_state, item: item:khevra_core, maximum_grade: degraded }
      - { kind: narration_only, note: "The core is recovered but loses most market and graft value." }
  fail:
    rule: "Below DC minus 5."
    result:
      - { kind: item_state, item: item:khevra_core, maximum_grade: degraded }
      - { kind: trigger_template_effect, effect: stability_check_if_active }
  botch:
    rule: "Natural 1 or reckless core damage while rushed."
    result:
      - { kind: item_state, item: item:khevra_core, grade: inert }
      - { kind: trigger_template_effect, effect: stability_check_if_active_or_secured_with_disadvantage }
contamination:
  druidic_actor:
    on_success: no_exposure
    on_partial: add_one_exposure_if_unprotected
    on_fail: add_one_exposure
    on_botch: add_one_exposure
  non_druidic_actor:
    on_success: no_exposure
    on_partial: add_one_exposure_if_unprotected
    on_fail: add_one_exposure_if_unprotected
    on_botch: add_one_exposure_if_unprotected
rules:
  - "Harvesting is not automatic loot; it is a check when an intact core matters."
  - "The best yield comes from preparation, proper tools, and avoiding destabilizing damage."
  - "A declared reckless core-damaging rushed harvest is botch regardless of the die. Otherwise natural 1 is botch and natural 20 is strong before margin bands; success is DC or above, partial is DC minus 5 through DC minus 1, and fail is lower."
  - "Harvest cannot improve the core's existing grade: use the lower of the current grade and the grade from the outcome."
  - "On fail or botch, apply the harvest grade cap first, then make the template's stability check when its lattice-state guard permits; an overload degrades the resulting grade one step, to a minimum of inert."
  - "Each completed outcome removes the core after any stability check and blast resolve. Transfer it from the creature to the consenting recipient named in the declared harvest; default to the harvester if no other recipient is named."
  - "Core custody does not by itself establish lawful ownership or authority to sell. Those follow the accepted circumstances or agreement."
  - "A discharged lattice does not make another stability check unless a separately defined effect reactivates it."
  - "Exposure triggers belonging to the same stabilization or harvest resolution apply at most one exposure to the same actor; separate later actions have separate exposure."
  - "A successful harvest has no outcome-based exposure, including when rushed; independently applicable handling or overload-save triggers still apply."
  - "The procedure emits ordinary item_state, damage, condition, and narration_only consequences."
  - "It never grants a reusable PC power by itself; grafting and augmentation remain separate world content."
visibility: table
