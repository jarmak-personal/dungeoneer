id: secret:second_setting_significance
kind: secret
schema: dwd.secret.v1
name: The Hidden Significance Of The Second Setting
summary: >
  Khevra's amplification draws from its origin plane, and widespread substitution
  removes load from that bridge. The prototypes are therefore one possible component
  of a transition away from khevra, although neither their existence nor their
  scaling rate alone determines whether civilization or the Cantor reaches a threshold first.
facts:
  - fact:khevra_amplifies_by_planar_draw
  - fact:khevra_free_substitution_reduces_bridge_load
holders: []
visibility: internal
implications:
  if_cantor_learns: >
    Edreth treats the research as a higher-priority threat than Choir sabotage and
    attacks it through accidents, propaganda, and poisoned supply chains.
  hero_line: >
    Connecting these prototypes with divine and ecological evidence can reveal a
    survivable tool for transition. It does not prescribe who bears the cost or how
    land, food, and power should be reorganized.
